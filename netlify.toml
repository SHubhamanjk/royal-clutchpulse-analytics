# Netlify Configuration for Royal ClutchPulse Static Dashboard

[build]
  publish = "."

# Caching headers for player portraits and static scripts
[[headers]]
  for = "/players/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Redirect rules (SPA fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
